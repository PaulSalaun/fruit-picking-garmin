name: Build and Release Venu 2 Connect IQ

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: 🔧 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 🚚 Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget unzip openssl

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 📱 Get devices definitions
        run: |
          cd ~
          wget https://hatl.at/devices.zip
          unzip -qq devices.zip

      - name: 🔧 Download and set up Connect IQ SDK
        run: |
          mkdir -p ~/sdk
          cd ~/sdk

          wget https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-8.1.1-2025-03-27-66dae750f.zip
          unzip -qq connectiq-sdk-lin-8.1.1-2025-03-27-66dae750f.zip

          echo "~/sdk/bin" >> $GITHUB_PATH

      - name: 👩‍💻 Generate developer key
        run: |
          openssl genrsa -out ~/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in ~/developer_key.pem -out ~/developer_key.der -nocrypt

      - name: ⌚ Build PRG
        run: |
           monkeyc -y ~/developer_key.der -f monkey.jungle -w -o /tmp/garminfruitpicking.prg

      - name: 🏪 Build IQ
        run: |
          monkeyc -y ~/developer_key.der -f monkey.jungle -w -e -o /tmp/garminfruitpicking.iq

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garminfruitpicking-build
          path: |
            /tmp/garminfruitpicking.prg
            /tmp/garminfruitpicking.iq

  release:
    name: 📦 Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕵️ Get version from manifest
        id: version
        run: |
          # Chercher manifest.xml à la racine ou dans monkeyc/
          if [ -f "manifest.xml" ]; then
            MANIFEST_PATH="manifest.xml"
          elif [ -f "monkeyc/manifest.xml" ]; then
            MANIFEST_PATH="monkeyc/manifest.xml"
          else
            echo "manifest.xml non trouvé !"
            exit 1
          fi
          
          VERSION=$(grep '<iq:application' "$MANIFEST_PATH" | grep -oP 'version="\K[^"]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag : v$VERSION"

      - name: 🚨 Check if tag already exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Le tag v${{ steps.version.outputs.version }} existe déjà !"
            echo "As-tu oublié de mettre à jour la version dans manifest.xml ?"
            exit 1
          fi

      - name: 🚚 Download artifacts from build
        uses: actions/download-artifact@v4
        with:
          name: garminfruitpicking-build
          path: ./artifacts

      - name: 📝 Rename outputs with version
        run: |
          mv ./artifacts/garminfruitpicking.prg "garminfruitpicking_${{ steps.version.outputs.version }}.prg"
          mv ./artifacts/garminfruitpicking.iq "garminfruitpicking_${{ steps.version.outputs.version }}.iq"

      - name: 📦 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            garminfruitpicking_*.prg
            garminfruitpicking_*.iq
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Version: ${{ steps.version.outputs.version }}
            Device: Venu 2
            App: garminfruitpicking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}