name: Build and Release Venu 2 Connect IQ

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: 🔧 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🚚 Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget unzip openssl default-jre

      - name: 🔧 Download and set up Connect IQ SDK
        run: |
          mkdir -p ~/sdk
          cd ~/sdk

          wget https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-8.4.0-2025-12-03-5122605dc.zip
          unzip -qq connectiq-sdk-lin-8.4.0-2025-12-03-5122605dc.zip

          SDK_DIR=$(find ~/sdk -type f -name monkeyc | head -n1 | xargs dirname | xargs dirname)

          echo "SDK_DIR=$SDK_DIR"
          echo "$SDK_DIR/bin" >> $GITHUB_PATH
          echo "CIQ_SDK_HOME=$SDK_DIR" >> $GITHUB_ENV

      - name: 🧪 Verify Venu devices
        run: |
          ls "$CIQ_SDK_HOME/devices" | grep venu

      - name: 👩‍💻 Generate developer key
        run: |
          openssl genrsa -out ~/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in ~/developer_key.pem -out ~/developer_key.der -nocrypt

      - name: ⌚ Build PRG
        run: |
           monkeyc -y ~/developer_key.der -f monkey.jungle -w -o /tmp/garminfruitpicking.prg

      - name: 🏪 Build IQ
        run: |
          monkeyc -y ~/developer_key.der -f monkey.jungle -w -e -o /tmp/garminfruitpicking.iq

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garminfruitpicking-build
          path: |
            /tmp/garminfruitpicking.prg
            /tmp/garminfruitpicking.iq

  release:
    name: 📦 Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕵️ Get version from manifest
        id: version
        run: |
          VERSION=$(grep -oP 'version="\K[^"]+' monkeyc/manifest.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag attendu : v$VERSION"

      - name: 🚨 Check if tag already exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Le tag v${{ steps.version.outputs.version }} existe déjà !"
            echo "As-tu oublié de mettre à jour la version dans manifest.xml ?"
            exit 1
          fi

      - name: 🚚 Download artifacts from build
        uses: actions/download-artifact@v4
        with:
          name: garminfruitpicking-build

      - name: 📝 Rename outputs with version
        run: |
          mv /tmp/garminfruitpicking.prg "garminfruitpicking_${{ steps.version.outputs.version }}.prg"
          mv /tmp/garminfruitpicking.iq "garminfruitpicking_${{ steps.version.outputs.version }}.iq"

      - name: 📦 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            garminfruitpicking_*.prg
            garminfruitpicking_*.iq
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Version: ${{ steps.version.outputs.version }}
            Device: Venu 2
            App: garminfruitpicking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
